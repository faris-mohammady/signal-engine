[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-engine"
version = "0.1.0"
description = "Config-driven account discovery, signal scoring and play recommendations for GTM teams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
signal-engine = "signal_engine.cli:app"

[tool.setuptools.packages.find]
include = ["signal_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
